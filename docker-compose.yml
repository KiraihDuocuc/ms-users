version: '3.8'

services:
  ms-users-app:
    build: .
    container_name: ms-users-app
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://ms-users-db:3306/users_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=3600000
    depends_on:
      ms-users-db:
        condition: service_healthy
    networks:
      - pets-network
    

  ms-users-db:
    image: mysql:8.0
    container_name: ms-users-db
    restart: always
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=users_db
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - ms_users_data:/var/lib/mysql
    networks:
      - pets-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ms_users_data:

networks:
  pets-network:
    driver: bridge
    external: true
    name: nombre_red_ms_pets